name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Unzip & Build Mod
        run: |
          # Automatically extract any zip files in the repo
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z"
            fi
          done

          # Search anywhere in the repo for build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: Could not find build.gradle!"
            echo "Here are the files currently in your repository:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          MOD_DIR=$(dirname "$GRADLE_FILE")
          echo "Found mod in: $MOD_DIR"
          cd "$MOD_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo "gradlew not found, using system gradle..."
            gradle build
          fi

      - name: Upload Compiled Mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: "**/build/libs/*.jar"
